<!DOCTYPE html>
<html>
<head>
    <title>Biblioteca</title>
</head>
<body>

<h2>Agregar libro</h2>
<form method="POST" action="/add">
    <input name="titulo" placeholder="Título" required>
    <input name="autor" placeholder="Autor" required>
    <input name="genero" placeholder="Género" required>
    <select name="estado">
        <option>Leído</option>
        <option>No leído</option>
    </select>
    <button type="submit">Agregar</button>
</form>

<h2>Lista de libros</h2>

<ul>
{% for book in books %}
    <li>
        {{ book.titulo }} - {{ book.autor }} ({{ book.estado }})
        <form method="POST" action="/delete/{{ book.id }}" style="display:inline;">
            <button type="submit">Eliminar</button>
        </form>
    </li>
{% endfor %}
</ul>

</body>
</html>
